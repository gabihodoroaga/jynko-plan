steps:
  # ----------------------------------------------------------------------------
  # Step 1: Build the Unified Container Image (Angular + Go Backend)
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'eu.gcr.io/$PROJECT_ID/jynko-plan:$SHORT_SHA'
      - '-t'
      - 'eu.gcr.io/$PROJECT_ID/jynko-plan:latest'
      - '.'

  # ----------------------------------------------------------------------------
  # Step 2: Push Image to Google Artifact Registry
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - 'eu.gcr.io/$PROJECT_ID/jynko-plan'

  # ----------------------------------------------------------------------------
  # Step 3: Deploy to Google Cloud Run
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image'
      - 'eu.gcr.io/$PROJECT_ID/jynko-plan:$SHORT_SHA'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--service-account'
      - '$_SERVICE_ACCOUNT@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars'
      - 'ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,FIRESTORE_DATABASE_ID=$_FIRESTORE_DB,IAP_AUDIENCE=$_IAP_AUDIENCE,STATIC_DIR=/app/web'
      - '--no-allow-unauthenticated'

substitutions:
  _SERVICE_NAME: 'jynko-plan-prod'
  _REGION: 'europe-west3'
  _SERVICE_ACCOUNT: 'jynko-plan-runner'
  _FIRESTORE_DB: '(default)'
  _IAP_AUDIENCE: ''

images:
  - 'eu.gcr.io/$PROJECT_ID/jynko-plan:$SHORT_SHA'
  - 'eu.gcr.io/$PROJECT_ID/jynko-plan:latest'

options:
  logging: CLOUD_LOGGING_ONLY
