steps:
  # ----------------------------------------------------------------------------
  # Step 1: Build the Unified Container Image (Angular + Go Backend)
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA'
      - '-t'
      - '${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:latest'
      - '.'

  # ----------------------------------------------------------------------------
  # Step 2: Push Image to Google Artifact Registry
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - '${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}'

  # ----------------------------------------------------------------------------
  # Step 3: Deploy to Google Cloud Run
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}-${_ENV_PREFIX}'
      - '--image'
      - '${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--iap'
      - '--service-account'
      - '$_SERVICE_ACCOUNT@$PROJECT_ID.iam.gserviceaccount.com'
      - '--update-env-vars'
      - 'ENV=$_ENV_PREFIX,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,FIRESTORE_DATABASE_ID=$_FIRESTORE_DB,IAP_AUDIENCE=$_IAP_AUDIENCE,ATTACHMENTS_GCS_BUCKET=$_ATTACHMENTS_GCS_BUCKET,STATIC_DIR=/app/web'
      - '--no-allow-unauthenticated'

substitutions:
  _ENV_PREFIX: 'prd'
  _SERVICE_NAME: 'jynko-plan'
  _REGION: 'europe-west3'
  _AR_LOCATION: 'europe-west3'
  _AR_REPOSITORY: 'jynko-plan'
  _SERVICE_ACCOUNT: 'jynko-plan-runner'
  _FIRESTORE_DB: '(default)'
  _IAP_AUDIENCE: ''
  _ATTACHMENTS_GCS_BUCKET: ''

images:
  - '${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA'
  - '${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
